name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**', 'claude/**']

env:
  PNPM_VERSION: '9.1.0'
  NODE_VERSION: '22'

jobs:
  setup:
    name: Install + cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: node scripts/sync-agent-skills.mjs --check
      - run: pnpm -F @aria/middleware typecheck
      - run: pnpm -F @aria/config    exec tsc --noEmit
      - run: pnpm -F @aria/web       exec tsc --noEmit

  unit-tests:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aria, POSTGRES_PASSWORD: aria, POSTGRES_DB: aria_dev }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U aria" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_dev
      WORKSPACE_ENCRYPTION_KEY: ci-workspace-encryption-key-32chars
      COOKIE_SECRET: ci-cookie-secret-must-be-at-least-32
      ARIA_LLM_MODE: mock
      ARIA_GITHUB_MODE: mock
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: node scripts/apply-migrations.cjs
      - run: node scripts/check-schema-drift.cjs
      - run: node scripts/sync-agent-skills.mjs --check
      - run: pnpm -F @aria/middleware test
      - run: pnpm -F @aria/web test

  java-tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -f apps/backend/pom.xml test

  anti-test-dodging:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - name: Identify changed test files
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          files=$(git diff --name-only "$BASE"...HEAD -- '**/*.test.ts' '**/*.spec.ts' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run anti-test-dodging
        if: steps.diff.outputs.files != ''
        env:
          GATE_FILES: ${{ steps.diff.outputs.files }}
        run: |
          mapfile -t files < <(printf '%s\n' "$GATE_FILES")
          pnpm -F @aria/middleware exec tsx ../../tools/anti-test-dodging.ts "${files[@]}"

  anti-slop:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - name: Identify changed UI files
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          files=$(git diff --name-only "$BASE"...HEAD -- '**/*.tsx' '**/*.css' '**/*.scss' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run anti-slop gate
        if: steps.diff.outputs.files != ''
        env:
          GATE_FILES: ${{ steps.diff.outputs.files }}
        run: |
          mapfile -t files < <(printf '%s\n' "$GATE_FILES")
          pnpm -F @aria/middleware exec tsx ../../tools/anti-slop-gate.ts "${files[@]}"

  e2e:
    needs: [typecheck, unit-tests]
    # Playwright 1.60 ships no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-tablet, chromium-mobile]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aria, POSTGRES_PASSWORD: aria, POSTGRES_DB: aria_dev }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U aria" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -F @aria/e2e exec playwright install --with-deps chromium
      - name: Bring up stack
        run: |
          bash scripts/generate-keys.sh
          export JWT_PRIVATE_KEY="$(base64 -w 0 private_key.pem)"
          export JWT_PUBLIC_KEY="$(base64 -w 0 public_key.pem)"
          rm -f private_key.pem public_key.pem
          export DATABASE_URL="postgresql://aria:aria@localhost:5432/aria_dev"
          export POSTGRES_HOST=localhost POSTGRES_PORT=5432 POSTGRES_DB=aria_dev POSTGRES_USER=aria POSTGRES_PASSWORD=aria
          export COOKIE_SECRET="ci-cookie-secret-must-be-at-least-32"
          export WORKSPACE_ENCRYPTION_KEY="ci-workspace-encryption-key-32chars"
          export ARIA_LLM_MODE=live
          export ARIA_GITHUB_MODE=live
          export CURSOR_API_BASE=http://127.0.0.1:4010
          export OPENAI_API_BASE=http://127.0.0.1:4010/v1
          export ANTHROPIC_API_BASE=http://127.0.0.1:4010
          export NVIDIA_API_BASE=http://127.0.0.1:4010/v1
          export GITHUB_API_BASE=http://127.0.0.1:4010
          export AUTH_RATE_LIMIT_MAX=2000
          export RATE_LIMIT_MAX=10000
          export GITHUB_CLIENT_ID=""
          export GITHUB_CLIENT_SECRET=""
          export ARIA_CURSOR_LOCAL_MODE=stub
          export RUN_WORKER_ENABLED=true
          export ARIA_DATA_DIR=/tmp/aria-data
          export ARIA_PUBLIC_URL=http://127.0.0.1:3001
          export NEXT_PUBLIC_MIDDLEWARE_URL="http://localhost:3001"
          node scripts/apply-migrations.cjs
          node scripts/provider-stub.mjs > /tmp/aria-stub.log 2>&1 &
          nohup pnpm -F @aria/middleware dev > /tmp/aria-middleware.log 2>&1 &
          nohup pnpm -F @aria/web dev > /tmp/aria-web.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3001/api/health >/dev/null && curl -sf http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          echo "stack did not become healthy" >&2
          tail -n 80 /tmp/aria-stub.log /tmp/aria-middleware.log /tmp/aria-web.log >&2 || true
          exit 1
      - run: pnpm -F @aria/e2e exec playwright test tests/milestone3b-jira.spec.ts tests/milestone3a-providers.spec.ts tests/milestone2-agents.spec.ts tests/milestone1-setup.spec.ts tests/m1-validation-message.spec.ts tests/m1-session-refresh.spec.ts tests/auth/landing.spec.ts tests/sprint1-auth.spec.ts tests/sprint2-projects.spec.ts tests/sprint3-analysis.spec.ts tests/sprint4-tickets.spec.ts tests/sprint4-sessions.spec.ts tests/sprint4-planning.spec.ts tests/sprint4-team.spec.ts tests/sprint4-settings.spec.ts tests/sprint4-ai.spec.ts --project=${{ matrix.project }}
      - name: Capture Milestone 1 screenshots
        if: matrix.project == 'chromium-desktop'
        run: |
          export DATABASE_URL="postgresql://aria:aria@localhost:5432/aria_dev"
          export NEXT_PUBLIC_MIDDLEWARE_URL="http://localhost:3001"
          export BASE_URL="http://localhost:3000"
          export API_URL="http://127.0.0.1:3001"
          export M1_SKIP_JAVA=1
          pnpm -F @aria/e2e exec node ../../scripts/m1-verify.mjs
      - name: Upload Milestone 1 screenshots
        if: matrix.project == 'chromium-desktop' && success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-verification-screenshots
          path: docs/verification/screenshots/
          if-no-files-found: error
          retention-days: 30

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build middleware image
        run: docker build -f Dockerfile.middleware -t aria-middleware:ci .
      - name: Build web image
        run: docker build -f Dockerfile.web -t aria-web:ci .
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t aria-backend:ci .
      - name: Boot the middleware image and run the planner child
        run: docker run --rm --entrypoint node aria-middleware:ci /repo/scripts/docker-planner-smoke.mjs
      - name: Start middleware, web, and backend against Postgres and Redis
        run: |
          set -euo pipefail
          bash scripts/generate-keys.sh
          export JWT_PRIVATE_KEY="$(base64 -w 0 private_key.pem)"
          export JWT_PUBLIC_KEY="$(base64 -w 0 public_key.pem)"
          rm -f private_key.pem public_key.pem
          export COOKIE_SECRET="ci-cookie-secret-must-be-at-least-32"
          export WORKSPACE_ENCRYPTION_KEY="ci-workspace-encryption-key-32chars"
          export POSTGRES_USER=aria POSTGRES_PASSWORD=aria POSTGRES_DB=aria_dev
          compose() { docker compose -f docker-compose.yml -f docker-compose.ci.yml "$@"; }
          cleanup() { compose logs --tail 80 || true; compose down -v || true; }
          trap cleanup EXIT
          compose up -d --no-build --wait --wait-timeout 300 postgres redis backend middleware web
          mw=""
          for i in $(seq 1 30); do
            mw="$(curl -fsS http://127.0.0.1:3001/api/health || true)"
            echo "$mw" | grep -q '"status":"healthy"' && break
            sleep 2
          done
          echo "$mw" | grep -q '"status":"healthy"'
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"status":"healthy"'
          web=""
          for i in $(seq 1 30); do
            web="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            [ "$web" = "200" ] && break
            sleep 2
          done
          [ "$web" = "200" ]
