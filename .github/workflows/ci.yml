name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**', 'claude/**']

env:
  PNPM_VERSION: '9.1.0'
  NODE_VERSION: '20'

jobs:
  setup:
    name: Install + cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -F @aria/middleware typecheck
      - run: pnpm -F @aria/config    exec tsc --noEmit
      - run: pnpm -F @aria/web       exec tsc --noEmit

  unit-tests:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aria, POSTGRES_PASSWORD: aria, POSTGRES_DB: aria_dev }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U aria" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_dev
      WORKSPACE_ENCRYPTION_KEY: ci-workspace-encryption-key-32chars
      COOKIE_SECRET: ci-cookie-secret-must-be-at-least-32
      ARIA_LLM_MODE: mock
      ARIA_GITHUB_MODE: mock
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: node scripts/apply-migrations.cjs
      - run: pnpm -F @aria/middleware test

  java-tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp -f apps/backend/pom.xml test

  anti-test-dodging:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - name: Identify changed test files
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          files=$(git diff --name-only "$BASE"...HEAD -- '**/*.test.ts' '**/*.spec.ts' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run anti-test-dodging
        if: steps.diff.outputs.files != ''
        run: pnpm -F @aria/middleware exec tsx ../../tools/anti-test-dodging.ts ${{ steps.diff.outputs.files }}

  anti-slop:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - name: Identify changed UI files
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="origin/main"; fi
          files=$(git diff --name-only "$BASE"...HEAD -- '**/*.tsx' '**/*.css' '**/*.scss' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Run anti-slop gate
        if: steps.diff.outputs.files != ''
        run: pnpm -F @aria/middleware exec tsx ../../tools/anti-slop-gate.ts ${{ steps.diff.outputs.files }}

  e2e:
    needs: [typecheck, unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-tablet, chromium-mobile]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aria, POSTGRES_PASSWORD: aria, POSTGRES_DB: aria_dev }
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U aria" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Bring up stack
        run: |
          bash scripts/generate-keys.sh
          export JWT_PRIVATE_KEY="$(base64 -w 0 private_key.pem)"
          export JWT_PUBLIC_KEY="$(base64 -w 0 public_key.pem)"
          rm -f private_key.pem public_key.pem
          export DATABASE_URL="postgresql://aria:aria@localhost:5432/aria_dev"
          export POSTGRES_HOST=localhost POSTGRES_PORT=5432 POSTGRES_DB=aria_dev POSTGRES_USER=aria POSTGRES_PASSWORD=aria
          export COOKIE_SECRET="ci-cookie-secret-must-be-at-least-32"
          export WORKSPACE_ENCRYPTION_KEY="ci-workspace-encryption-key-32chars"
          export ARIA_LLM_MODE=mock
          export ARIA_GITHUB_MODE=mock
          export GITHUB_CLIENT_ID=""
          export GITHUB_CLIENT_SECRET=""
          export NEXT_PUBLIC_MIDDLEWARE_URL="http://localhost:3001"
          node scripts/apply-migrations.cjs
          # Milestone e2e uses mock LLM and GitHub so it does not need real keys or Ollama.
          # Older sprint specs stay in the tree and are not the gate until those features are wired.
          nohup pnpm -F @aria/middleware dev > /tmp/aria-middleware.log 2>&1 &
          nohup pnpm -F @aria/web dev > /tmp/aria-web.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3001/api/health >/dev/null && curl -sf http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          echo "stack did not become healthy" >&2
          exit 1
      - run: pnpm -F @aria/e2e exec playwright test tests/milestone1-setup.spec.ts tests/auth/landing.spec.ts --project=${{ matrix.project }}
