name: shadow-learning

# Shadow Learning Git hook (V27.9 §6).
# On every merged PR, diff the change and propose EXPERIENCE.md / experience.yml updates
# as a follow-up PR. The proposals are always `veracity: ai-only` — a human must promote
# them via PR review to graduate to `human-approved`.
# A push only runs the ready job. Lesson extraction stays on a merged pull request.
#
# Auto-PR enablement (pick one):
#   1. Settings → Actions → General → Workflow permissions → enable
#      "Allow GitHub Actions to create and approve pull requests", or
#   2. Add repo secret SHADOW_LEARNING_PAT (fine-grained PAT with Contents + Pull requests write).
# Without either, this job still pushes the lessons branch and writes a compare link
# into the job summary so the owner can open the PR in one click.

on:
  push:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to analyse (defaults to default branch HEAD)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "shadow-learning extracts a lesson only after a merged pull request"

  extract-lessons:
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: '9.1.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile=false

      - name: Resolve target SHA + base
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="$INPUT_SHA"
            [ -z "$SHA" ] && SHA="$HEAD_SHA"
            BASE=$(git rev-parse "${SHA}~1" 2>/dev/null || git rev-parse origin/main)
          else
            SHA="$MERGE_SHA"
            BASE="$BASE_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Summarise diff into experience drafts (no LLM)
        id: extract
        env:
          BASE: ${{ steps.refs.outputs.base }}
          SHA: ${{ steps.refs.outputs.sha }}
        run: |
          mkdir -p .aria/shadow_learning
          git diff --name-only "$BASE" "$SHA" > .aria/shadow_learning/files.txt
          git log -1 --pretty=%B "$SHA" > .aria/shadow_learning/message.txt
          node -e '
            const fs = require("fs");
            const files = fs.readFileSync(".aria/shadow_learning/files.txt","utf8").trim().split("\n").filter(Boolean);
            const msg = fs.readFileSync(".aria/shadow_learning/message.txt","utf8").trim();
            const skill = files.some(f => f.startsWith("apps/web/")) ? "frontend-web-specialist"
                       : files.some(f => f.startsWith("apps/middleware/")) ? "backend-api-specialist"
                       : files.some(f => f.startsWith("apps/backend/")) ? "backend-api-specialist"
                       : files.some(f => f.startsWith("apps/e2e/")) ? "qa-e2e"
                       : "devops-engineer";
            const text = msg.split("\n")[0].slice(0, 240).replace(/"/g, "\\\"");
            const sha = (process.env.SHA || "").slice(0, 7);
            const yaml = "- text: \"" + text + " (sha " + sha + ")\"\n" +
                          "  veracity: ai-only\n" +
                          "  captured_at: \"" + new Date().toISOString() + "\"\n";
            fs.writeFileSync(".aria/shadow_learning/proposed.yml", JSON.stringify({ skill, text, yaml }));
          '
          cat .aria/shadow_learning/proposed.yml

      - name: Open follow-up PR with the draft entry
        env:
          # Prefer optional PAT so PR create works without the Actions "create and approve PRs" setting.
          GH_TOKEN: ${{ secrets.SHADOW_LEARNING_PAT || secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.refs.outputs.sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          PAYLOAD=$(cat .aria/shadow_learning/proposed.yml)
          SKILL=$(node -e "console.log(JSON.parse(process.argv[1]).skill)" "$PAYLOAD")
          export YAML=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).yaml)" "$PAYLOAD")
          BRANCH="shadow-learning/${SHA}"
          git config user.name  "aria-shadow-learning"
          git config user.email "aria-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          export FILE=".entiresystem/skills/${SKILL}/experience.yml"
          if [ ! -f "$FILE" ]; then
            echo "No new lessons — $FILE not present yet. Skipping."
            {
              echo "## Shadow Learning"
              echo
              echo "Skipped: \`$FILE\` is not present yet, so there is nothing to draft."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -q '^best_practices: \[\]' "$FILE"; then
            python3 - <<'PY'
          import os, pathlib
          file = pathlib.Path(os.environ['FILE'])
          yaml = os.environ['YAML']
          src = file.read_text()
          src = src.replace('best_practices: []', 'best_practices:\n' + ''.join('  ' + l + '\n' for l in yaml.splitlines()))
          file.write_text(src)
          PY
          else
            printf '%s' "$YAML" | sed 's/^/  /' >> "$FILE"
          fi
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No new lessons — experience.yml unchanged after draft. Skipping."
            {
              echo "## Shadow Learning"
              echo
              echo "Skipped: draft produced no changes in \`$FILE\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "shadow-learning(${SKILL}): draft entry from ${SHA}"
          git push -u origin "$BRANCH"

          COMPARE_URL="https://github.com/${REPO}/compare/${DEFAULT_BRANCH}...${BRANCH}?expand=1"
          TITLE="Shadow Learning: draft for ${SKILL}"
          BODY="Auto-extracted lesson candidate (veracity: ai-only). Promote to human-approved by editing the entry, or close to discard."

          set +e
          PR_OUT=$(gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "$TITLE" --body "$BODY" 2>&1)
          PR_STATUS=$?
          set -e
          if [ "$PR_STATUS" -eq 0 ]; then
            echo "$PR_OUT"
            {
              echo "## Shadow Learning"
              echo
              echo "Opened follow-up PR: $PR_OUT"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only the Actions "create/approve pull requests" permission error is soft-failed.
          if echo "$PR_OUT" | grep -qi 'GitHub Actions is not permitted to create or approve pull requests'; then
            echo "gh pr create blocked by repo Actions permissions; branch pushed. Owner can open the PR via the compare link."
            {
              echo "## Shadow Learning — PR not auto-created"
              echo
              echo "GitHub Actions is not permitted to create pull requests in this repository."
              echo "The lessons branch was pushed successfully."
              echo
              echo "**Open the PR in one click:** [Compare \`${BRANCH}\` → \`${DEFAULT_BRANCH}\`](${COMPARE_URL})"
              echo
              echo "To enable full auto-PRs, either:"
              echo "1. Settings → Actions → General → Workflow permissions → enable **Allow GitHub Actions to create and approve pull requests**, or"
              echo "2. Add a fine-grained PAT as repo secret \`SHADOW_LEARNING_PAT\` (Contents + Pull requests write)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::gh pr create failed unexpectedly"
          echo "$PR_OUT"
          exit "$PR_STATUS"
